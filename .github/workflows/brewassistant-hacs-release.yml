name: BrewAssistant HACS test release

on:
  push:
    branches:
      - brewassistant-grainfather
  pull_request:
    branches:
      - brewassistant-grainfather
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  release:
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release ba]')) ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[release ba]'))
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Checkout release target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/grainfather/manifest.json"))["version"])')"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=BrewAssistant Grainfather v$VERSION" >> "$GITHUB_ENV"

      - name: Create tag if missing
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET_SHA" -m "$RELEASE_TITLE"
            git push origin "$TAG"
          fi

      - name: Create GitHub release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          BrewAssistant test release from `brewassistant-grainfather`.

          Modern GF30 ESP/MQTT telemetry runtime:

          - verified REST accessory/controller discovery and ESP chip matching
          - verified MQTT username/password derivation from the current app
          - field-verified MQTT TLS/8883 connection and subscriptions
          - live temperature, target, heat/cool, controller mode/status and metadata
          - bounded telemetry keepalive matching the app's command 23 behavior
          - proactive telemetry refresh before the 120-second subscription expires
          - TLS-only MQTT transport on port 8883; plaintext 1883 fallback removed
          - command-topic echoes excluded from inbound telemetry freshness
          - passive observation of non-23 app commands for protocol diagnostics
          - command observations do not alter telemetry freshness
          - fresh MQTT events take precedence with automatic REST/history fallback
          - field-verified command 0 supervised target write with confirm + MQTT readback
          - command 23 remains limited to telemetry values 15/120
          - live GF30 controller sensors and binary sensors
          - no heater, cooling, control-mode, profile, hysteresis or calibration write path
          - safe connection/write diagnostics and REST/history fallback

          This is a BrewAssistant test build, not an upstream fidley release.
          EOF

          gh release create "$TAG" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release-notes.md
