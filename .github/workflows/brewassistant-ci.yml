name: BrewAssistant CI

on:
  push:
    branches:
      - brewassistant-grainfather
  pull_request:
    branches:
      - brewassistant-grainfather
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile Python
        run: python -m compileall custom_components/grainfather tests tools

      - name: Pytest
        run: python -m pytest -q

      - name: Ruff new BrewAssistant files
        # Upstream currently contains pre-existing Ruff debt. Keep this branch
        # from adding lint debt without rewriting unrelated upstream files.
        run: >-
          python -m ruff check
          custom_components/grainfather/esp_runtime.py
          tools/probe_particle_readonly.py
          tools/probe_esp_accessory_readonly.py
          tests/test_esp_runtime.py
